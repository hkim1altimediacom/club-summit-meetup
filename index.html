<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정상회담 출석 체크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#F1F3EC;
  --surface:#FFFFFF;
  --surface-2:#FBFDF8;
  --ink:#1E2A22;
  --ink-muted:#5C6B5F;
  --ink-faint:#93A092;
  --border:#DDE3D6;
  --accent:#C97829;
  --accent-strong:#A9601C;
  --accent-ink:#FFFFFF;
  --attend:#3E8259;
  --attend-bg:#E4F1E8;
  --decline:#B4503A;
  --decline-bg:#F6E7E2;
  --pending:#8A8272;
  --pending-bg:#EFECE1;
  --shadow:0 1px 2px rgba(30,42,34,0.06), 0 10px 28px -14px rgba(30,42,34,0.22);
  --focus:0 0 0 3px rgba(201,120,41,0.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141C17;
    --surface:#1C2620;
    --surface-2:#212C25;
    --ink:#E9EEE4;
    --ink-muted:#A9B6A1;
    --ink-faint:#71806F;
    --border:#2E3A31;
    --accent:#E8A24C;
    --accent-strong:#F2B569;
    --accent-ink:#1C1305;
    --attend:#6BBE8B;
    --attend-bg:#20302A;
    --decline:#E08A6C;
    --decline-bg:#38271F;
    --pending:#C2BAA4;
    --pending-bg:#2A2A21;
    --shadow:0 1px 2px rgba(0,0,0,0.35), 0 14px 32px -16px rgba(0,0,0,0.6);
    --focus:0 0 0 3px rgba(232,162,76,0.4);
  }
}
:root[data-theme="dark"]{
  --paper:#141C17;
  --surface:#1C2620;
  --surface-2:#212C25;
  --ink:#E9EEE4;
  --ink-muted:#A9B6A1;
  --ink-faint:#71806F;
  --border:#2E3A31;
  --accent:#E8A24C;
  --accent-strong:#F2B569;
  --accent-ink:#1C1305;
  --attend:#6BBE8B;
  --attend-bg:#20302A;
  --decline:#E08A6C;
  --decline-bg:#38271F;
  --pending:#C2BAA4;
  --pending-bg:#2A2A21;
  --shadow:0 1px 2px rgba(0,0,0,0.35), 0 14px 32px -16px rgba(0,0,0,0.6);
  --focus:0 0 0 3px rgba(232,162,76,0.4);
}
*,*::before,*::after{box-sizing:border-box;}
html{background:var(--paper);}
body{
  margin:0;
  min-height:100vh;
  background:var(--paper);
  color:var(--ink);
  font-family:'Gothic A1',-apple-system,'Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:32px 16px 64px;
}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.readonly-banner{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--ink-muted);
  font-size:13px;
  line-height:1.5;
  padding:10px 14px;
  border-radius:10px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:28px 24px;
}
.eyebrow{
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--accent-strong);
  text-transform:uppercase;
  margin:0 0 6px;
}
.title-row{display:flex;align-items:flex-start;gap:8px;}
.title{
  font-family:'Black Han Sans','Gothic A1',sans-serif;
  font-weight:400;
  font-size:38px;
  line-height:1.15;
  letter-spacing:-.01em;
  margin:0;
  color:var(--ink);
  text-wrap:balance;
}
.meta{
  list-style:none;
  margin:20px 0 0;
  padding:16px 0 0;
  border-top:1px dashed var(--border);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.meta-row{display:flex;align-items:center;gap:10px;}
.meta-row-cal{align-items:flex-start;}
.meta-icon{
  width:28px;height:28px;flex:none;
  border-radius:8px;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-strong);
}
.meta-icon svg{width:16px;height:16px;}
.meta-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-faint);
  width:34px;
  flex:none;
}
.meta-value{
  font-size:16px;
  font-weight:500;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  flex:1;
}
.field-row{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.edit-btn{
  border:none;
  background:transparent;
  color:var(--ink-faint);
  cursor:pointer;
  padding:6px;
  border-radius:8px;
  display:inline-flex;
  flex:none;
  text-decoration:none;
}
.edit-btn:hover{background:var(--surface-2);color:var(--accent-strong);}
.edit-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:var(--focus);}
.edit-btn svg{width:15px;height:15px;}
.edit-input{
  flex:1;
  min-width:0;
  font:inherit;
  font-size:16px;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid var(--accent);
  background:var(--surface-2);
  color:var(--ink);
}
.title-row .edit-input{font-family:'Gothic A1',sans-serif;font-size:20px;font-weight:700;}
.icon-btn{
  border:none;
  cursor:pointer;
  border-radius:8px;
  width:30px;height:30px;
  flex:none;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:16px;height:16px;}
.icon-save{background:var(--attend);color:#fff;}
.icon-cancel{background:var(--surface-2);color:var(--ink-muted);}
.calendar{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-title{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.cal-nav{border:none;background:var(--surface);color:var(--ink-muted);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
.cal-nav:hover{color:var(--accent-strong);}
.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-weekdays{text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:4px;}
.cal-wd.cal-sun{color:var(--decline);}
.cal-wd.cal-sat{color:var(--accent-strong);}
.cal-grid{gap:2px;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;}
button.cal-day{border:none;background:transparent;color:var(--ink);cursor:pointer;border-radius:8px;font-variant-numeric:tabular-nums;flex-direction:column;gap:2px;}
button.cal-day:hover{background:var(--surface);}
button.cal-day.cal-sun{color:var(--decline);}
button.cal-day.cal-sat{color:var(--accent-strong);}
button.cal-day.cal-holiday{color:var(--decline);}
button.cal-day.cal-today{box-shadow:inset 0 0 0 1px var(--border);font-weight:700;}
button.cal-day.cal-selected{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none;}
.cal-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex:none;}
.cal-legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-faint);padding:8px 2px 0;}
.cal-legend .cal-dot{background:var(--decline);}
.cal-footer{display:flex;justify-content:flex-end;margin-top:6px;}
.cal-cancel{border:none;background:transparent;color:var(--ink-faint);font-size:12px;font-weight:700;cursor:pointer;padding:6px 10px;border-radius:8px;}
.cal-cancel:hover{background:var(--surface);color:var(--ink);}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.section-head h2{font-size:18px;margin:0;font-weight:700;}
.section-sub{font-size:12px;color:var(--ink-faint);margin:-8px 0 14px;}
.stats{display:flex;gap:6px;flex-wrap:wrap;}
.stat{
  font-size:12px;
  font-weight:700;
  padding:5px 10px;
  border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.stat-yes{background:var(--attend-bg);color:var(--attend);}
.stat-pending{background:var(--pending-bg);color:var(--pending);}
.stat-no{background:var(--decline-bg);color:var(--decline);}
.stat-novote{background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--border);}
.stat-saving{background:var(--surface);color:var(--ink-faint);border:1px solid var(--border);}
.budget{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px 12px;
  background:var(--surface-2);
  border:1px dashed var(--border);
  border-radius:12px;
  padding:10px 14px;
  margin-bottom:14px;
  font-size:13px;
}
.budget-label{font-weight:700;color:var(--ink-muted);flex:none;}
.budget-formula{color:var(--ink-faint);flex:1;min-width:120px;font-variant-numeric:tabular-nums;}
.budget-total{font-weight:800;font-size:15px;color:var(--accent-strong);font-variant-numeric:tabular-nums;flex:none;}
.callout{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--pending-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 14px;
  margin-bottom:14px;
  font-size:13px;
  color:var(--ink-muted);
}
.callout b{color:var(--ink);font-weight:700;}
.callout-btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink-muted);
  font-size:12px;font-weight:700;
  padding:6px 12px;border-radius:8px;cursor:pointer;flex:none;
}
.callout-btn:hover{color:var(--accent-strong);border-color:var(--accent);}
.novote-tag{
  font-size:11px;font-weight:700;color:var(--ink-faint);
  background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:3px 8px;flex:none;
}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.roster-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px 10px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-2);
}
.name{
  flex:1;
  min-width:0;
  font-size:15px;
  font-weight:500;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.segmented{
  display:inline-flex;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  flex:none;
}
.segmented button{
  border:none;
  background:var(--surface);
  color:var(--ink-muted);
  font-size:12px;
  font-weight:700;
  padding:7px 10px;
  cursor:pointer;
  border-left:1px solid var(--border);
}
.segmented button:first-child{border-left:none;}
.segmented button[data-status="yes"].active{background:var(--attend);color:#fff;}
.segmented button[data-status="pending"].active{background:var(--pending);color:#fff;}
.segmented button[data-status="no"].active{background:var(--decline);color:#fff;}
.remove{
  border:none;background:transparent;color:var(--ink-faint);
  cursor:pointer;font-size:16px;line-height:1;width:26px;height:26px;
  border-radius:8px;flex:none;
}
.remove:hover{background:var(--decline-bg);color:var(--decline);}
.empty{
  font-size:14px;color:var(--ink-faint);
  text-align:center;padding:18px 0;margin:0;
}
.add-form{
  display:flex;gap:8px;margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.add-form input{
  flex:1;min-width:0;
  font:inherit;font-size:15px;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink);
}
.add-form input::placeholder{color:var(--ink-faint);}
.add-form button{
  border:none;
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:700;
  font-size:14px;
  padding:0 18px;
  border-radius:10px;
  cursor:pointer;
  flex:none;
}
.add-form button:hover{background:var(--accent-strong);}
button:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed;}
.updated{
  text-align:center;
  font-size:12px;
  color:var(--ink-faint);
  margin:2px 0 0;
}
.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--paper);
  font-size:13px;
  padding:10px 16px;
  border-radius:10px;
  box-shadow:var(--shadow);
  max-width:calc(100% - 32px);
  text-align:center;
  z-index:10;
}
.poll-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
.poll-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px 10px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-2);
}
.poll-row.poll-lead{border-color:var(--accent);}
.poll-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;overflow:hidden;}
.poll-place-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.poll-crown{
  font-size:10px;font-weight:800;flex:none;
  background:var(--accent);color:var(--accent-ink);
  border-radius:999px;padding:2px 7px;
}
.poll-badge{
  font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:999px;
  background:var(--surface);color:var(--ink-muted);
  border:1px solid var(--border);
  flex:none;font-variant-numeric:tabular-nums;
}
.poll-row.poll-lead .poll-badge{background:var(--attend);color:#fff;border-color:transparent;}
.poll-empty{font-size:13px;color:var(--ink-faint);margin:0 0 12px;}
.poll-add-btn{
  border:1px dashed var(--border);background:transparent;color:var(--ink-muted);
  font-size:13px;font-weight:700;padding:11px;border-radius:12px;cursor:pointer;
  width:100%;margin-bottom:14px;
}
.poll-add-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
.pref-select{
  flex:none;
  font:inherit;font-size:13px;font-weight:600;
  padding:7px 10px;border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);color:var(--ink);
  max-width:58%;
}
.pref-hint{font-size:13px;color:var(--ink-faint);text-align:center;padding:4px 0 0;margin:0;}
.admin-row{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
.admin-badge{font-size:11px;font-weight:700;color:var(--attend);background:var(--attend-bg);padding:5px 10px;border-radius:999px;flex:none;}
.admin-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--ink-muted);font-size:11px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;flex:none;}
.admin-btn:hover{color:var(--accent-strong);border-color:var(--accent);}
.section-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;}
.reset-btn{border:1px solid var(--border);background:transparent;color:var(--ink-faint);font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;flex:none;white-space:nowrap;}
.reset-btn:hover{color:var(--decline);border-color:var(--decline);}
@media (prefers-reduced-motion:no-preference){
  .roster-row,.card,.poll-row{transition:background .15s ease;}
}
</style>
</head>

var WEEKDAYS_KO = ['일','월','화','수','목','금','토'];
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function toISO(y, m, d){ return y + '-' + pad2(m + 1) + '-' + pad2(d); }
function todayParts(){
  var t = new Date();
  return { y: t.getFullYear(), m: t.getMonth(), d: t.getDate() };
}
function parseAnyDate(s){
  if(!s) return null;
  var iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(iso) return { y:+iso[1], m:+iso[2]-1, d:+iso[3] };
  var legacy = /^(\d{1,2})\/(\d{1,2})$/.exec(s);
  if(legacy) return { y: todayParts().y, m:+legacy[1]-1, d:+legacy[2] };
  return null;
}
function formatDateDisplay(s){
  var p = parseAnyDate(s);
  if(!p) return s;
  var wd = new Date(p.y, p.m, p.d).getDay();
  return (p.m + 1) + '월 ' + p.d + '일 (' + WEEKDAYS_KO[wd] + ')';
}
function buildCalendarGrid(y, m, selectedISO){
  var first = new Date(y, m, 1);
  var startWeekday = first.getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var t = todayParts();
  var todayISO = toISO(t.y, t.m, t.d);
  var cells = '';
  for(var i = 0; i < startWeekday; i++){ cells += '<span class="cal-cell cal-empty"></span>'; }
  var hasHolidayThisMonth = false;
  for(var d = 1; d <= daysInMonth; d++){
    var iso = toISO(y, m, d);
    var wd = new Date(y, m, d).getDay();
    var holidayName = HOLIDAYS_KO[iso] || null;
    if(holidayName) hasHolidayThisMonth = true;
    var cls = 'cal-cell cal-day' + (wd===0?' cal-sun':'') + (wd===6?' cal-sat':'') + (holidayName?' cal-holiday':'') +
      (iso===todayISO?' cal-today':'') + (iso===selectedISO?' cal-selected':'');
    cells += '<button type="button" class="' + cls + '" data-action="pick-date-option" data-date="' + iso + '"' +
      (holidayName ? ' title="' + esc(holidayName) + '"' : '') + '>' + d +
      (holidayName ? '<i class="cal-dot" aria-hidden="true"></i>' : '') + '</button>';
  }
  var weekdays = WEEKDAYS_KO.map(function(w, i){
    return '<span class="cal-wd' + (i===0?' cal-sun':'') + (i===6?' cal-sat':'') + '">' + w + '</span>';
  }).join('');
  return (
    '<div class="calendar">' +
      '<div class="cal-head">' +
        '<button type="button" class="cal-nav" data-action="cal-prev" aria-label="이전 달">‹</button>' +
        '<span class="cal-title">' + y + '년 ' + (m + 1) + '월</span>' +
        '<button type="button" class="cal-nav" data-action="cal-next" aria-label="다음 달">›</button>' +
      '</div>' +
      '<div class="cal-weekdays">' + weekdays + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      (hasHolidayThisMonth ? '<div class="cal-legend"><i class="cal-dot" aria-hidden="true"></i><span>공휴일 (길게 보려면 날짜에 마우스를 올려보세요)</span></div>' : '') +
      '<div class="cal-footer"><button type="button" class="cal-cancel" data-action="cancel-field">취소</button></div>' +
    '</div>'
  );
}

function migrateState(data){
  if(!Array.isArray(data.attendees)) data.attendees = [];
  if(!Array.isArray(data.dateOptions) || !data.dateOptions.length){
    data.dateOptions = data.date ? [{id:'d-legacy', date: data.date}] : [];
  }
  if(!Array.isArray(data.placeOptions) || !data.placeOptions.length){
    data.placeOptions = data.place ? [{id:'p-legacy', place: data.place}] : [];
  }
  delete data.date;
  delete data.place;
  data.attendees.forEach(function(a){
    if(a.datePick === undefined) a.datePick = null;
    if(a.placePick === undefined) a.placePick = null;
    if(a.status === undefined) a.status = null;
  });
  return data;
}

function computeLead(options, attendees, pickField){
  if(!options.length) return { leaders: [], count: 0 };
  var counts = options.map(function(o){
    return { opt:o, count: attendees.filter(function(a){ return a[pickField] === o.id; }).length };
  });
  var max = Math.max.apply(null, counts.map(function(c){ return c.count; }));
  if(max === 0) return { leaders: [], count: 0 };
  return { leaders: counts.filter(function(c){ return c.count === max; }).map(function(c){ return c.opt; }), count: max };
}

        (isAdmin ? '<div class="section-actions"><button type="button" class="reset-btn" data-action="reset-date">투표 초기화</button></div>' : '') +
      '</div>' +
      dateOptionsHtml +
      addDateHtml +
      datePersonHtml +
    '</section>' +
    '<section class="card">' +
      '<div class="section-head">' +
        '<h2>장소 투표</h2>' +
        (isAdmin ? '<div class="section-actions"><button type="button" class="reset-btn" data-action="reset-place">투표 초기화</button></div>' : '') +
      '</div>' +
      placeOptionsHtml +
      addPlaceHtml +
      placePersonHtml +
    '</section>' +
    updatedHtml;

  if(EDITING === 'title'){
    var input = document.getElementById('edit-input');
    if(input){ input.focus(); input.select(); }
  }
}

function showToast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.hidden = false;
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
}

// ---------------------------------------------------------------------
// Firebase 연동
// ---------------------------------------------------------------------
var db = null, auth = null, docRef = null;

function persist(mutate){
  if(!canEditNow()) return;
  EDITING = null;
  SAVING = true;
  render();
  runTransaction(db, function(tx){
    return tx.get(docRef).then(function(snap){
      var data = snap.exists() ? snap.data() : JSON.parse(JSON.stringify(DEFAULT_STATE));
      data = migrateState(JSON.parse(JSON.stringify(data)));
      mutate(data);
      data.updatedAt = new Date().toISOString();
      tx.set(docRef, data);
    });
  }).then(function(){
    SAVING = false;
    // Don't rely on the onSnapshot listener to re-render: whether the
    // snapshot for this write arrives before or after this handler runs
    // is not guaranteed, so re-enable the UI here regardless. If the
    // snapshot lands after, it will simply render again with the
    // confirmed data.
    render();
  }).catch(function(err){
    console.error(err);
    SAVING = false;
    render();
    showToast('저장하지 못했어요. 다시 시도해 주세요.');
  });
}

function handleClick(e){
  var editBtn = e.target.closest('[data-action="edit-field"]');
  if(editBtn){
    EDITING = editBtn.getAttribute('data-field');
    render();
    return;
  }
  var cancelBtn = e.target.closest('[data-action="cancel-field"]');
  if(cancelBtn){
    EDITING = null;
    render();
    return;
  }
  var saveBtn = e.target.closest('[data-action="save-field"]');
  if(saveBtn){
    saveField(saveBtn.getAttribute('data-field'));
    return;
  }
  var addDateBtn = e.target.closest('[data-action="add-date-toggle"]');
  if(addDateBtn){
    EDITING = 'add-date';
    var t0 = todayParts();
    CAL_VIEW = { y: t0.y, m: t0.m };
    render();
    return;
  }
  var prevBtn = e.target.closest('[data-action="cal-prev"]');
  if(prevBtn){
    CAL_VIEW.m -= 1;
    if(CAL_VIEW.m < 0){ CAL_VIEW.m = 11; CAL_VIEW.y -= 1; }
    render();
    return;
  }
  var nextBtn = e.target.closest('[data-action="cal-next"]');
  if(nextBtn){
    CAL_VIEW.m += 1;
    if(CAL_VIEW.m > 11){ CAL_VIEW.m = 0; CAL_VIEW.y += 1; }
    render();
    return;
  }
  var pickOptBtn = e.target.closest('[data-action="pick-date-option"]');
  if(pickOptBtn){
    var iso = pickOptBtn.getAttribute('data-date');
    if(STATE.dateOptions.some(function(o){return o.date===iso;})){
      showToast('이미 등록된 날짜예요.');
      EDITING = null;
      render();
      return;
    }
    persist(function(data){
      if(!data.dateOptions.some(function(o){return o.date===iso;})){
        data.dateOptions.push({id: uid(), date: iso});
      }
    });
    return;
  }
  var statusBtn = e.target.closest('[data-action="set-status"]');
  if(statusBtn && !statusBtn.disabled){
    var id = statusBtn.getAttribute('data-id');
    var status = statusBtn.getAttribute('data-status');
    persist(function(data){
      var a = data.attendees.find(function(x){ return x.id === id; });
      if(a) a.status = status;
    });
    return;
  }
  var removeBtn = e.target.closest('[data-action="remove"]');
  if(removeBtn){
    if(!isAdminNow()) return;
    var rid = removeBtn.getAttribute('data-id');
    if(!window.confirm('이 인원을 명단에서 삭제할까요?')) return;
    persist(function(data){
      data.attendees = data.attendees.filter(function(x){ return x.id !== rid; });
    });
    return;
  }
  var removeDateOpt = e.target.closest('[data-action="remove-date-option"]');
  if(removeDateOpt){
    if(!isAdminNow()) return;
    var doid = removeDateOpt.getAttribute('data-id');
    if(!window.confirm('이 날짜 후보를 삭제할까요? 이 후보에 투표한 사람은 미투표로 바뀌어요.')) return;
    persist(function(data){
      data.dateOptions = data.dateOptions.filter(function(o){ return o.id !== doid; });
      data.attendees.forEach(function(a){ if(a.datePick === doid) a.datePick = null; });
    });
    return;
  }
  var removePlaceOpt = e.target.closest('[data-action="remove-place-option"]');
  if(removePlaceOpt){
    if(!isAdminNow()) return;
    var poid = removePlaceOpt.getAttribute('data-id');
    if(!window.confirm('이 장소 후보를 삭제할까요? 이 후보에 투표한 사람은 미투표로 바뀌어요.')) return;
    persist(function(data){
      data.placeOptions = data.placeOptions.filter(function(o){ return o.id !== poid; });
      data.attendees.forEach(function(a){ if(a.placePick === poid) a.placePick = null; });
    });
    return;
  }
  var resetAttendBtn = e.target.closest('[data-action="reset-attend"]');
  if(resetAttendBtn){
    if(!isAdminNow()) return;
    if(!window.confirm('모든 인원의 참석 여부를 미투표 상태로 초기화할까요? (명단은 유지돼요)')) return;
    persist(function(data){
      data.attendees.forEach(function(a){ a.status = null; });
    });
    return;
  }
  var resetDateBtn = e.target.closest('[data-action="reset-date"]');
  if(resetDateBtn){
    if(!isAdminNow()) return;
    if(!window.confirm('모든 인원의 날짜 투표를 초기화할까요? (후보 목록은 유지돼요)')) return;
    persist(function(data){
      data.attendees.forEach(function(a){ a.datePick = null; });
    });
    return;
  }
  var resetPlaceBtn = e.target.closest('[data-action="reset-place"]');
  if(resetPlaceBtn){
    if(!isAdminNow()) return;
    if(!window.confirm('모든 인원의 장소 투표를 초기화할까요? (후보 목록은 유지돼요)')) return;
    persist(function(data){
      data.attendees.forEach(function(a){ a.placePick = null; });
    });
    return;
  }
  var adminUnlockBtn = e.target.closest('[data-action="admin-unlock"]');
  if(adminUnlockBtn){
    var pin = window.prompt('관리자 PIN을 입력하세요');
    if(pin === null) return;
    if(pin === ADMIN_PIN){
      IS_ADMIN = true;
      try{ localStorage.setItem('clubAdminUnlocked', '1'); }catch(e){}
      showToast('관리자 모드가 켜졌어요.');
      render();
    } else {
      showToast('PIN이 올바르지 않아요.');
    }
    return;
  }
  var adminLockBtn = e.target.closest('[data-action="admin-lock"]');
  if(adminLockBtn){
    IS_ADMIN = false;
    try{ localStorage.removeItem('clubAdminUnlocked'); }catch(e){}
    showToast('관리자 모드를 껐어요.');
    render();
    return;
  }
  var copyBtn = e.target.closest('[data-action="copy-novote"]');
  if(copyBtn){
    var names = STATE.attendees.filter(function(a){return !a.status;}).map(function(a){return a.name;});
    var text = '아직 참석 여부를 체크 안 한 사람: ' + names.join(', ');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('복사했어요.');
      }).catch(function(){
        showToast('복사에 실패했어요.');
      });
    } else {
      showToast('이 브라우저는 복사를 지원하지 않아요.');
    }
    return;
  }
}

function handleChange(e){
  var dateSel = e.target.closest('[data-action="pick-date-pref"]');
  if(dateSel){
    var did = dateSel.getAttribute('data-id');
    var dval = dateSel.value || null;
    persist(function(data){
      var a = data.attendees.find(function(x){ return x.id === did; });
      if(a) a.datePick = dval;
    });
    return;
  }
  var placeSel = e.target.closest('[data-action="pick-place-pref"]');
  if(placeSel){
    var pid = placeSel.getAttribute('data-id');
    var pval = placeSel.value || null;
    persist(function(data){
      var a = data.attendees.find(function(x){ return x.id === pid; });
      if(a) a.placePick = pval;
    });
    return;
  }
}

function saveField(field){
  var input = document.getElementById('edit-input');
  if(!input) return;
  var value = input.value.trim();
  if(!value){ EDITING = null; render(); return; }
  persist(function(data){
    data[field] = value;
  });
}

function handleKeydown(e){
  if(e.target && e.target.id === 'edit-input'){
    if(e.key === 'Enter'){ e.preventDefault(); saveField(e.target.getAttribute('data-field')); }
    if(e.key === 'Escape'){ e.preventDefault(); EDITING = null; render(); }
  }
}

function handleSubmit(e){
  if(e.target && e.target.id === 'add-form'){
    e.preventDefault();
    var input = document.getElementById('new-name');
    var name = input.value.trim();
    if(!name) return;
    persist(function(data){
      data.attendees.push({id: uid(), name: name, status: null, datePick: null, placePick: null});
    });
    var again = document.getElementById('new-name');
    if(again){ again.value = ''; again.focus(); }
    return;
  }
  if(e.target && e.target.id === 'add-place-form'){
    e.preventDefault();
    var pinput = document.getElementById('new-place');
    var place = pinput.value.trim();
    if(!place) return;
    if(STATE.placeOptions.some(function(o){return o.place===place;})){
      showToast('이미 등록된 장소예요.');
      return;
    }
    persist(function(data){
      if(!data.placeOptions.some(function(o){return o.place===place;})){
        data.placeOptions.push({id: uid(), place: place});
      }
    });
    var pagain = document.getElementById('new-place');
    if(pagain){ pagain.value = ''; pagain.focus(); }
  }
}

function init(){
  var app = document.getElementById('app');
  app.addEventListener('click', handleClick);
  app.addEventListener('change', handleChange);
  app.addEventListener('keydown', handleKeydown);
  app.addEventListener('submit', handleSubmit);
  render();

  if(!CONFIG_OK) return;

  try{
    var fbApp = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(fbApp);
    auth = getAuth(fbApp);
    docRef = doc(db, 'clubEvents', EVENT_ID);
  }catch(e){
    console.error(e);
    LOAD_ERROR = true;
    render();
    return;
  }

  onAuthStateChanged(auth, function(user){
    AUTH_READY = !!user;
    render();
  });
  signInAnonymously(auth).catch(function(err){
    console.error(err);
    LOAD_ERROR = true;
    render();
  });

  onSnapshot(docRef, function(snap){
    if(snap.exists()){
      STATE = migrateState(snap.data());
    } else {
      STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
      setDoc(docRef, STATE).catch(function(err){ console.error(err); });
    }
    LOADED = true;
    render();
  }, function(err){
    console.error(err);
    LOAD_ERROR = true;
    render();
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
