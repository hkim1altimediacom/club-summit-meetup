<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정상회담 출석 체크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#F1F3EC;
  --surface:#FFFFFF;
  --surface-2:#FBFDF8;
  --ink:#1E2A22;
  --ink-muted:#5C6B5F;
  --ink-faint:#93A092;
  --border:#DDE3D6;
  --accent:#C97829;
  --accent-strong:#A9601C;
  --accent-ink:#FFFFFF;
  --attend:#3E8259;
  --attend-bg:#E4F1E8;
  --decline:#B4503A;
  --decline-bg:#F6E7E2;
  --pending:#8A8272;
  --pending-bg:#EFECE1;
  --shadow:0 1px 2px rgba(30,42,34,0.06), 0 10px 28px -14px rgba(30,42,34,0.22);
  --focus:0 0 0 3px rgba(201,120,41,0.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141C17;
    --surface:#1C2620;
    --surface-2:#212C25;
    --ink:#E9EEE4;
    --ink-muted:#A9B6A1;
    --ink-faint:#71806F;
    --border:#2E3A31;
    --accent:#E8A24C;
    --accent-strong:#F2B569;
    --accent-ink:#1C1305;
    --attend:#6BBE8B;
    --attend-bg:#20302A;
    --decline:#E08A6C;
    --decline-bg:#38271F;
    --pending:#C2BAA4;
    --pending-bg:#2A2A21;
    --shadow:0 1px 2px rgba(0,0,0,0.35), 0 14px 32px -16px rgba(0,0,0,0.6);
    --focus:0 0 0 3px rgba(232,162,76,0.4);
  }
}
:root[data-theme="dark"]{
  --paper:#141C17;
  --surface:#1C2620;
  --surface-2:#212C25;
  --ink:#E9EEE4;
  --ink-muted:#A9B6A1;
  --ink-faint:#71806F;
  --border:#2E3A31;
  --accent:#E8A24C;
  --accent-strong:#F2B569;
  --accent-ink:#1C1305;
  --attend:#6BBE8B;
  --attend-bg:#20302A;
  --decline:#E08A6C;
  --decline-bg:#38271F;
  --pending:#C2BAA4;
  --pending-bg:#2A2A21;
  --shadow:0 1px 2px rgba(0,0,0,0.35), 0 14px 32px -16px rgba(0,0,0,0.6);
  --focus:0 0 0 3px rgba(232,162,76,0.4);
}
*,*::before,*::after{box-sizing:border-box;}
html{background:var(--paper);}
body{
  margin:0;
  min-height:100vh;
  background:var(--paper);
  color:var(--ink);
  font-family:'Gothic A1',-apple-system,'Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:32px 16px 64px;
  /* 버튼 클릭마다 화면 전체를 새로 그리는데, 브라우저의 자동 스크롤 보정
     기능이 그 순간 스크롤 위치를 살짝 튀게 만들 수 있어 꺼둡니다.
     (스크롤 위치 복원은 render()에서 직접 처리해요.) */
  overflow-anchor:none;
}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.poll-columns{display:flex;flex-direction:column;gap:16px;}
@media (min-width:900px){
  .wrap{max-width:980px;}
  .poll-columns{flex-direction:row;align-items:flex-start;}
  .poll-columns > section{flex:1;min-width:0;}
}
.readonly-banner{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--ink-muted);
  font-size:13px;
  line-height:1.5;
  padding:10px 14px;
  border-radius:10px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:28px 24px;
}
.eyebrow{
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--accent-strong);
  text-transform:uppercase;
  margin:0 0 6px;
}
.title-row{display:flex;align-items:flex-start;gap:8px;}
.title{
  font-family:'Black Han Sans','Gothic A1',sans-serif;
  font-weight:400;
  font-size:38px;
  line-height:1.15;
  letter-spacing:-.01em;
  margin:0;
  color:var(--ink);
  text-wrap:balance;
}
.meta{
  list-style:none;
  margin:20px 0 0;
  padding:16px 0 0;
  border-top:1px dashed var(--border);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.meta-row{display:flex;align-items:center;gap:10px;}
.meta-row-cal{align-items:flex-start;}
.meta-icon{
  width:28px;height:28px;flex:none;
  border-radius:8px;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-strong);
}
.meta-icon svg{width:16px;height:16px;}
.meta-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-faint);
  width:34px;
  flex:none;
}
.meta-value{
  font-size:16px;
  font-weight:500;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  flex:1;
}
.field-row{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.edit-btn{
  border:none;
  background:transparent;
  color:var(--ink-faint);
  cursor:pointer;
  padding:6px;
  border-radius:8px;
  display:inline-flex;
  flex:none;
  text-decoration:none;
}
.edit-btn:hover{background:var(--surface-2);color:var(--accent-strong);}
.edit-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:var(--focus);}
.edit-btn svg{width:15px;height:15px;}
.edit-input{
  flex:1;
  min-width:0;
  font:inherit;
  font-size:16px;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid var(--accent);
  background:var(--surface-2);
  color:var(--ink);
}
.title-row .edit-input{font-family:'Gothic A1',sans-serif;font-size:20px;font-weight:700;}
.icon-btn{
  border:none;
  cursor:pointer;
  border-radius:8px;
  width:30px;height:30px;
  flex:none;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:16px;height:16px;}
.icon-save{background:var(--attend);color:#fff;}
.icon-cancel{background:var(--surface-2);color:var(--ink-muted);}
.calendar{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-title{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.cal-quarter{font-weight:500;color:var(--ink-faint);}
.cal-nav{border:none;background:var(--surface);color:var(--ink-muted);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
.cal-nav:hover{color:var(--accent-strong);}
.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-weekdays{text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:4px;}
.cal-wd.cal-sun{color:var(--decline);}
.cal-wd.cal-sat{color:var(--accent-strong);}
.cal-grid{gap:2px;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;}
button.cal-day{border:none;background:transparent;color:var(--ink);cursor:pointer;border-radius:8px;font-variant-numeric:tabular-nums;flex-direction:column;gap:2px;}
button.cal-day:hover{background:var(--surface);}
button.cal-day.cal-sun{color:var(--decline);}
button.cal-day.cal-sat{color:var(--accent-strong);}
button.cal-day.cal-holiday{color:var(--decline);}
button.cal-day.cal-today{box-shadow:inset 0 0 0 1px var(--border);font-weight:700;}
button.cal-day.cal-selected{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none;}
.cal-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex:none;}
.cal-legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-faint);padding:8px 2px 0;}
.cal-legend .cal-dot{background:var(--decline);}
.cal-hint{font-size:11px;color:var(--ink-faint);margin:8px 2px 0;line-height:1.5;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.section-head h2{font-size:18px;margin:0;font-weight:700;}
.quarter-tag{display:inline-block;vertical-align:middle;margin-left:6px;font-size:11px;font-weight:700;color:var(--ink-muted);background:var(--surface-2);border:1px solid var(--border);padding:3px 8px;border-radius:999px;}
.section-sub{font-size:12px;color:var(--ink-faint);margin:-8px 0 14px;}
.stats{display:flex;gap:6px;flex-wrap:wrap;}
.stat{
  font-size:12px;
  font-weight:700;
  padding:5px 10px;
  border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.stat-saving{background:var(--surface);color:var(--ink-faint);border:1px solid var(--border);}
.stat-saving-slot{visibility:hidden;}
.poll-cost{font-size:12px;color:var(--ink-faint);flex:none;white-space:nowrap;font-variant-numeric:tabular-nums;}
.poll-row.poll-lead .poll-cost{color:var(--accent-strong);font-weight:700;}
.callout{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--pending-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 14px;
  margin-bottom:14px;
  font-size:13px;
  color:var(--ink-muted);
}
.callout b{color:var(--ink);font-weight:700;}
.callout-btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink-muted);
  font-size:12px;font-weight:700;
  padding:6px 12px;border-radius:8px;cursor:pointer;flex:none;
}
.callout-btn:hover{color:var(--accent-strong);border-color:var(--accent);}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.roster-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px 10px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-2);
}
.name{
  flex:1;
  min-width:0;
  font-size:15px;
  font-weight:500;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.remove{
  border:none;background:transparent;color:var(--ink-faint);
  cursor:pointer;font-size:16px;line-height:1;width:26px;height:26px;
  border-radius:8px;flex:none;
}
.remove:hover{background:var(--decline-bg);color:var(--decline);}
.empty{
  font-size:14px;color:var(--ink-faint);
  text-align:center;padding:18px 0;margin:0;
}
.add-form{
  display:flex;gap:8px;margin:14px 0;padding-top:14px;
  border-top:1px dashed var(--border);
}
.add-form input{
  flex:1;min-width:0;
  font:inherit;font-size:15px;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink);
}
.add-form input::placeholder{color:var(--ink-faint);}
.add-form button{
  border:none;
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:700;
  font-size:14px;
  padding:0 18px;
  border-radius:10px;
  cursor:pointer;
  flex:none;
}
.add-form button:hover{background:var(--accent-strong);}
button:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed;}
.updated{
  text-align:center;
  font-size:12px;
  color:var(--ink-faint);
  margin:2px 0 0;
}
.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--paper);
  font-size:13px;
  padding:10px 16px;
  border-radius:10px;
  box-shadow:var(--shadow);
  max-width:calc(100% - 32px);
  text-align:center;
  z-index:10;
}
.poll-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
.poll-row{
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-2);
  overflow:hidden;
}
.poll-row.poll-lead{border-color:var(--accent);}
.poll-row-head{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;}
.poll-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;overflow:hidden;}
button.poll-main{border:none;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0;}
.poll-chevron{margin-left:auto;flex:none;color:var(--ink-faint);transition:transform .15s ease;font-size:14px;}
.poll-chevron-open{transform:rotate(90deg);}
.poll-detail{padding:2px 14px 12px;border-top:1px dashed var(--border);margin-top:2px;padding-top:10px;}
.voter-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.voter-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;}
.voter-name{color:var(--ink);font-weight:500;}
.voter-empty{font-size:13px;color:var(--ink-faint);margin:0;}
.poll-place-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.poll-crown{
  font-size:10px;font-weight:800;flex:none;
  background:var(--accent);color:var(--accent-ink);
  border-radius:999px;padding:2px 7px;
}
.poll-badge{
  font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:999px;
  background:var(--surface);color:var(--ink-muted);
  border:1px solid var(--border);
  flex:none;font-variant-numeric:tabular-nums;
}
.poll-row.poll-lead .poll-badge{background:var(--attend);color:#fff;border-color:transparent;}
.poll-empty{font-size:13px;color:var(--ink-faint);margin:0 0 12px;}
.poll-add-btn{
  border:1px dashed var(--border);background:transparent;color:var(--ink-muted);
  font-size:13px;font-weight:700;padding:11px;border-radius:12px;cursor:pointer;
  width:100%;margin-bottom:14px;
}
.poll-add-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
.pref-select{
  flex:none;
  font:inherit;font-size:13px;font-weight:600;
  padding:7px 10px;border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);color:var(--ink);
  max-width:58%;
}
.pref-hint{font-size:13px;color:var(--ink-faint);text-align:center;padding:4px 0 0;margin:0;}
.chip-group{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:62%;}
.chip-btn{
  font:inherit;font-size:12px;font-weight:700;
  padding:6px 10px;border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);color:var(--ink-muted);
  cursor:pointer;white-space:nowrap;
}
.chip-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
.chip-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.chip-btn:disabled{cursor:default;opacity:.7;}
.chip-btn:disabled:hover{border-color:var(--border);color:var(--ink-muted);}
.log-board{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
.log-board-head{margin-bottom:8px;}
.log-board-head h3{font-size:13px;font-weight:700;color:var(--ink-muted);margin:0;}
.log-list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.log-row{display:flex;align-items:baseline;gap:8px;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--surface-2);}
.log-name{font-weight:700;color:var(--ink);flex:none;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.log-text{flex:1;min-width:0;color:var(--ink-muted);word-break:break-word;}
.log-time{font-size:11px;color:var(--ink-faint);flex:none;white-space:nowrap;}
.log-remove{border:none;background:transparent;color:var(--ink-faint);cursor:pointer;font-size:14px;line-height:1;flex:none;padding:2px 4px;border-radius:6px;}
.log-remove:hover{background:var(--decline-bg);color:var(--decline);}
.log-empty{font-size:13px;color:var(--ink-faint);margin:0 0 10px;}
.log-toggle{display:block;border:none;background:transparent;color:var(--accent-strong);font-size:12px;font-weight:700;cursor:pointer;padding:2px 0 10px;}
.log-toggle:hover{text-decoration:underline;}
.log-form select#log-name{flex:none;width:96px;font:inherit;font-size:14px;padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);}
.log-form select#log-name:disabled{color:var(--ink-faint);}
.log-form input#log-text{flex:1;min-width:0;}
.admin-row{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
.admin-badge{font-size:11px;font-weight:700;color:var(--attend);background:var(--attend-bg);padding:5px 10px;border-radius:999px;flex:none;}
.admin-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--ink-muted);font-size:11px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;flex:none;}
.admin-btn:hover{color:var(--accent-strong);border-color:var(--accent);}
.section-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;}
.reset-btn{border:1px solid var(--border);background:transparent;color:var(--ink-faint);font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;flex:none;white-space:nowrap;}
.reset-btn:hover{color:var(--decline);border-color:var(--decline);}
@media (prefers-reduced-motion:no-preference){
  .roster-row,.card,.poll-row{transition:background .15s ease;}
}
</style>
</head>

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function uid(){
  return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

// ---------------------------------------------------------------------
// 클릭 위치 고정(스크롤 튐 방지)
// ---------------------------------------------------------------------
// data-action/data-id(/data-opt)로 식별되는 버튼(투표 칩 등)을 클릭하면,
// 화면을 다시 그린 뒤에도 그 버튼이 같은 화면 위치에 남아있도록 스크롤을
// 보정해요. id 값은 uid()로 만들어지는 안전한 문자열이라 별도 escape 없이
// 그대로 선택자에 써도 괜찮아요.
function isSafeAttrValue(v){
  return typeof v === 'string' && v.indexOf('"') === -1 && v.indexOf('\\') === -1;
}
var ANCHOR_ID_ATTRS = ['data-id', 'data-date']; // 버튼마다 고유 식별자로 쓰는 속성 이름
function findAnchorEl(el){
  var node = el;
  while(node && node !== document.body){
    if(node.getAttribute && node.getAttribute('data-action')){
      for(var i = 0; i < ANCHOR_ID_ATTRS.length; i++){
        if(node.getAttribute(ANCHOR_ID_ATTRS[i])) return node;
      }
    }
    node = node.parentElement;
  }
  return null;
}
function anchorSelector(info){
  if(!info) return null;
  var sel = '[data-action="' + info.action + '"][' + info.idAttr + '="' + info.id + '"]';
  if(info.opt) sel += '[data-opt="' + info.opt + '"]';
  return sel;
}
function captureScrollAnchor(el){
  var anchorEl = findAnchorEl(el);
  if(!anchorEl) { SCROLL_ANCHOR = null; return; }
  var action = anchorEl.getAttribute('data-action');
  var idAttr = null, id = null;
  for(var i = 0; i < ANCHOR_ID_ATTRS.length; i++){
    var v = anchorEl.getAttribute(ANCHOR_ID_ATTRS[i]);
    if(v){ idAttr = ANCHOR_ID_ATTRS[i]; id = v; break; }
  }
  var opt = anchorEl.getAttribute('data-opt');
  if(!isSafeAttrValue(action) || !isSafeAttrValue(id) || (opt && !isSafeAttrValue(opt))){
    SCROLL_ANCHOR = null;
    return;
  }
  SCROLL_ANCHOR = { action: action, idAttr: idAttr, id: id, opt: opt || null, top: anchorEl.getBoundingClientRect().top };
}

// 투표 결과(datePicks/placePicks) 값 자체는 빼고 비교해요 - 그 값만 바뀐
// 거라면 화면 구조는 그대로라는 뜻이라, 부분 렌더링으로 충분해요.
// 주의: Firestore에서 내려온 객체를 JSON.stringify로 통째로 비교하면 안 돼요.
// 실제 Firestore는 내부적으로 필드 순서가 매번 똑같다고 보장하지 않아서,
// 데이터는 그대로인데 키 순서만 달라져도 문자열이 달라질 수 있어요. 그래서
// 필요한 값만 직접 뽑아 순서를 우리가 고정해서 문자열로 만듭니다.
function structureSignature(data){
  var dateOptSig = (data.dateOptions || []).map(function(o){ return o.id + ':' + o.date; }).join('|');
  var placeOptSig = (data.placeOptions || []).map(function(o){ return o.id + ':' + o.place; }).join('|');
  var logsSig = (data.logs || []).map(function(l){ return l.id + ':' + l.name + ':' + l.text + ':' + l.ts; }).join('|');
  var attendeesSig = (data.attendees || []).map(function(a){ return a.id + ':' + a.name; }).join('|');
  return [data.title, dateOptSig, placeOptSig, logsSig, attendeesSig].join('~~');
}

var WEEKDAYS_KO = ['일','월','화','수','목','금','토'];
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function toISO(y, m, d){ return y + '-' + pad2(m + 1) + '-' + pad2(d); }
function todayParts(){
  var t = new Date();
  return { y: t.getFullYear(), m: t.getMonth(), d: t.getDate() };
}
function quarterOf(month0){ return Math.floor(month0 / 3) + 1; } // month0: 0~11
function parseAnyDate(s){
  if(!s) return null;
  var iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(iso) return { y:+iso[1], m:+iso[2]-1, d:+iso[3] };
  var legacy = /^(\d{1,2})\/(\d{1,2})$/.exec(s);
  if(legacy) return { y: todayParts().y, m:+legacy[1]-1, d:+legacy[2] };
  return null;
}
function formatDateDisplay(s){
  var p = parseAnyDate(s);
  if(!p) return s;
  var wd = new Date(p.y, p.m, p.d).getDay();
  return (p.m + 1) + '월 ' + p.d + '일 (' + WEEKDAYS_KO[wd] + ')';
}
function formatDateShort(s){
  var p = parseAnyDate(s);
  if(!p) return s;
  return (p.m + 1) + '/' + p.d;
}
function buildCalendarGrid(y, m, candidateISOs){
  var first = new Date(y, m, 1);
  var startWeekday = first.getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var t = todayParts();
  var todayISO = toISO(t.y, t.m, t.d);
  var cells = '';
  for(var i = 0; i < startWeekday; i++){ cells += '<span class="cal-cell cal-empty"></span>'; }
  var hasHolidayThisMonth = false;
  for(var d = 1; d <= daysInMonth; d++){
    var iso = toISO(y, m, d);
    var wd = new Date(y, m, d).getDay();
    var holidayName = HOLIDAYS_KO[iso] || null;
    if(holidayName) hasHolidayThisMonth = true;
    var isCandidate = candidateISOs && candidateISOs.indexOf(iso) !== -1;
    var cls = 'cal-cell cal-day' + (wd===0?' cal-sun':'') + (wd===6?' cal-sat':'') + (holidayName?' cal-holiday':'') +
      (iso===todayISO?' cal-today':'') + (isCandidate?' cal-selected':'');
    cells += '<button type="button" class="' + cls + '" data-action="pick-date-option" data-date="' + iso + '"' +
      (holidayName ? ' title="' + esc(holidayName) + '"' : '') + '>' + d +
      (holidayName ? '<i class="cal-dot" aria-hidden="true"></i>' : '') + '</button>';
  }
  var weekdays = WEEKDAYS_KO.map(function(w, i){
    return '<span class="cal-wd' + (i===0?' cal-sun':'') + (i===6?' cal-sat':'') + '">' + w + '</span>';
  }).join('');
  return (
    '<div class="calendar">' +
      '<div class="cal-head">' +
        '<button type="button" class="cal-nav" data-action="cal-prev" aria-label="이전 달">‹</button>' +
        '<span class="cal-title">' + y + '년 ' + (m + 1) + '월 <span class="cal-quarter">(' + quarterOf(m) + '분기)</span></span>' +
        '<button type="button" class="cal-nav" data-action="cal-next" aria-label="다음 달">›</button>' +
      '</div>' +
      '<div class="cal-weekdays">' + weekdays + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      (hasHolidayThisMonth ? '<div class="cal-legend"><i class="cal-dot" aria-hidden="true"></i><span>공휴일 (길게 보려면 날짜에 마우스를 올려보세요)</span></div>' : '') +
      '<p class="cal-hint">주황색으로 표시된 날짜는 이미 등록된 후보예요. 클릭하면 그 날짜의 출석 리스트가 열려요. 빈 날짜를 클릭하면 새 후보로 추가됩니다.</p>' +
    '</div>'
  );
}

function migrateState(data){
  if(!Array.isArray(data.attendees)) data.attendees = [];
  if(!Array.isArray(data.logs)) data.logs = [];
  if(!Array.isArray(data.dateOptions) || !data.dateOptions.length){
    data.dateOptions = data.date ? [{id:'d-legacy', date: data.date}] : [];
  }
  if(!Array.isArray(data.placeOptions) || !data.placeOptions.length){
    data.placeOptions = data.place ? [{id:'p-legacy', place: data.place}] : [];
  }
  delete data.date;
  delete data.place;
  data.attendees.forEach(function(a){
    if(!Array.isArray(a.datePicks)){
      // 예전 버전은 날짜를 1개만 고를 수 있었어요(datePick). 여러 날짜를 고를 수
      // 있도록 바뀌면서 그 값을 배열로 옮겨줍니다.
      a.datePicks = (a.datePick !== undefined && a.datePick !== null) ? [a.datePick] : [];
    }
    delete a.datePick;
    if(!Array.isArray(a.placePicks)){
      // 예전 버전은 장소도 1개만 고를 수 있었어요(placePick). 여러 장소를 고를 수
      // 있도록 바뀌면서 그 값을 배열로 옮겨줍니다.
      a.placePicks = (a.placePick !== undefined && a.placePick !== null) ? [a.placePick] : [];
    }
    delete a.placePick;
    delete a.status;
  });
  return data;
}

function computeLead(options, attendees, matchFn){
  if(!options.length) return { leaders: [], count: 0 };
  var counts = options.map(function(o){
    return { opt:o, count: attendees.filter(function(a){ return matchFn(a, o); }).length };
  });
  var max = Math.max.apply(null, counts.map(function(c){ return c.count; }));
  if(max === 0) return { leaders: [], count: 0 };
  return { leaders: counts.filter(function(c){ return c.count === max; }).map(function(c){ return c.opt; }), count: max };
}

// 날짜/장소 투표는 클릭 빈도가 훨씬 높은 조작이라, 페이지 전체를 다시
// 그리지 않고 "투표 현황" 영역(집계 리스트/1위 표시/미투표 안내/요약 문구)만
// 새로 그릴 수 있도록 이 조각들을 별도 함수로 분리해뒀어요. render()도
// 이 함수들을 그대로 호출해서 로직이 두 곳에 따로 존재하지 않게 합니다.
function computeDateLead(){
  return computeLead(STATE.dateOptions, STATE.attendees, function(a, o){ return Array.isArray(a.datePicks) && a.datePicks.indexOf(o.id) !== -1; });
}
function computePlaceLead(){
  return computeLead(STATE.placeOptions, STATE.attendees, function(a, o){ return Array.isArray(a.placePicks) && a.placePicks.indexOf(o.id) !== -1; });
}
function buildDateSummaryText(){
  var dateLead = computeDateLead();
  return !STATE.dateOptions.length
    ? '아직 후보 없음'
    : (dateLead.count === 0
        ? '아직 투표 없음'
        : esc(dateLead.leaders.map(function(o){ return formatDateDisplay(o.date); }).join(' / ')) + ' · ' + dateLead.count + '표');
}
function buildPlaceSummaryText(){
  var placeLead = computePlaceLead();
  return !STATE.placeOptions.length
    ? '아직 후보 없음'
    : (placeLead.count === 0
        ? '아직 투표 없음'
        : esc(placeLead.leaders.map(function(o){ return o.place; }).join(' / ')) + ' · ' + placeLead.count + '표');
}
function buildDateNovoteCallout(){
  var canEdit = canEditNow();
  var dateNovoteNames = STATE.attendees.filter(function(a){return !Array.isArray(a.datePicks) || !a.datePicks.length;}).map(function(a){return a.name;});
  return dateNovoteNames.length
    ? '<div class="callout"><span>아직 날짜 투표를 안 한 사람: <b>' + esc(dateNovoteNames.join(', ')) + '</b></span>' +
        (canEdit ? '<button type="button" class="callout-btn" data-action="copy-novote">복사</button>' : '') +
      '</div>'
    : '';
}
function buildDateOptionsHtml(){
  var isAdmin = isAdminNow();
  var dateLead = computeDateLead();
  if(DATE_EXPANDED && !STATE.dateOptions.some(function(o){return o.id===DATE_EXPANDED;})){
    DATE_EXPANDED = null;
  }
  return STATE.dateOptions.length
    ? '<ul class="poll-list">' + STATE.dateOptions.map(function(o){
        var count = STATE.attendees.filter(function(a){return Array.isArray(a.datePicks) && a.datePicks.indexOf(o.id)!==-1;}).length;
        var isLead = dateLead.count > 0 && dateLead.leaders.some(function(l){return l.id===o.id;});
        var isOpen = DATE_EXPANDED === o.id;
        var voters = STATE.attendees.filter(function(a){ return Array.isArray(a.datePicks) && a.datePicks.indexOf(o.id)!==-1; });
        var votersHtml = voters.length
          ? '<ul class="voter-list">' + voters.map(function(a){
              return '<li class="voter-row"><span class="voter-name">' + esc(a.name) + '</span></li>';
            }).join('') + '</ul>'
          : '<p class="voter-empty">아직 이 날짜를 선택한 사람이 없어요.</p>';
        return (
          '<li class="poll-row' + (isLead?' poll-lead':'') + '">' +
            '<div class="poll-row-head">' +
              '<button type="button" class="poll-main" data-action="toggle-date-list" data-id="' + o.id + '" aria-expanded="' + (isOpen?'true':'false') + '">' +
                (isLead?'<span class="poll-crown">1위</span>':'') + '<span>' + esc(formatDateDisplay(o.date)) + '</span>' +
                '<span class="poll-chevron' + (isOpen?' poll-chevron-open':'') + '" aria-hidden="true">›</span>' +
              '</button>' +
              '<span class="poll-badge">' + count + '표</span>' +
              '<span class="poll-cost">' + (count * PER_PERSON_COST).toLocaleString('ko-KR') + '원</span>' +
              (isAdmin ? '<button type="button" class="remove" data-action="remove-date-option" data-id="' + o.id + '" aria-label="' + esc(formatDateDisplay(o.date)) + ' 후보 삭제">×</button>' : '') +
            '</div>' +
            (isOpen ? '<div class="poll-detail">' + votersHtml + '</div>' : '') +
          '</li>'
        );
      }).join('') + '</ul>'
    : '<p class="poll-empty">' + (isAdmin ? '아직 등록된 날짜 후보가 없어요. 아래 달력에서 추가해 보세요.' : '아직 등록된 날짜 후보가 없어요. 운영자가 추가하면 여기에 표시돼요.') + '</p>';
}
function buildPlaceOptionsHtml(){
  var isAdmin = isAdminNow();
  var placeLead = computePlaceLead();
  return STATE.placeOptions.length
    ? '<ul class="poll-list">' + STATE.placeOptions.map(function(o){
        var count = STATE.attendees.filter(function(a){return Array.isArray(a.placePicks) && a.placePicks.indexOf(o.id)!==-1;}).length;
        var isLead = placeLead.count > 0 && placeLead.leaders.some(function(l){return l.id===o.id;});
        return (
          '<li class="poll-row' + (isLead?' poll-lead':'') + '">' +
            '<div class="poll-row-head">' +
              '<span class="poll-main">' + (isLead?'<span class="poll-crown">1위</span>':'') + '<span class="poll-place-text">' + esc(o.place) + '</span></span>' +
              '<a class="edit-btn" href="' + naverMapUrl(o.place) + '" target="_blank" rel="noopener noreferrer" aria-label="네이버 지도에서 ' + esc(o.place) + ' 검색" title="네이버 지도에서 검색">' + iconSearch() + '</a>' +
              '<span class="poll-badge">' + count + '표</span>' +
              (isAdmin ? '<button type="button" class="remove" data-action="remove-place-option" data-id="' + o.id + '" aria-label="' + esc(o.place) + ' 후보 삭제">×</button>' : '') +
            '</div>' +
          '</li>'
        );
      }).join('') + '</ul>'
    : '<p class="poll-empty">아직 등록된 장소 후보가 없어요. 아래에서 추가해 보세요.</p>';
}

// 투표 칩을 눌렀을 때: 화면 전체 대신 위 조각들만 다시 그려요.
function patchDateVoteUI(){
  var wrap = document.getElementById('date-poll-list-wrap');
  if(wrap) wrap.innerHTML = buildDateOptionsHtml();
  var novoteWrap = document.getElementById('date-novote-wrap');
  if(novoteWrap) novoteWrap.innerHTML = buildDateNovoteCallout();
  var summaryEl = document.getElementById('date-summary-value');
  if(summaryEl) summaryEl.innerHTML = buildDateSummaryText();
}
function patchPlaceVoteUI(){
  var wrap = document.getElementById('place-poll-list-wrap');
  if(wrap) wrap.innerHTML = buildPlaceOptionsHtml();
  var summaryEl = document.getElementById('place-summary-value');
  if(summaryEl) summaryEl.innerHTML = buildPlaceSummaryText();
}

// data 객체(전체 문서) 위에서 날짜/장소 선호를 토글해요. 낙관적 UI 업데이트와
// 실제 저장(트랜잭션) 양쪽에서 같은 함수를 재사용해서 로직이 어긋나지 않게 합니다.
function toggleDatePickOn(data, attendeeId, optId){
  var a = data.attendees.find(function(x){ return x.id === attendeeId; });
  if(!a) return;
  if(!Array.isArray(a.datePicks)) a.datePicks = [];
  var idx = a.datePicks.indexOf(optId);
  if(idx === -1) a.datePicks.push(optId); else a.datePicks.splice(idx, 1);
}
function togglePlacePickOn(data, attendeeId, optId){
  var a = data.attendees.find(function(x){ return x.id === attendeeId; });
  if(!a) return;
  if(!Array.isArray(a.placePicks)) a.placePicks = [];
  var idx = a.placePicks.indexOf(optId);
  if(idx === -1) a.placePicks.push(optId); else a.placePicks.splice(idx, 1);
}

function render(){
  // 버튼 클릭 후 페이지 전체를 다시 그리는 방식이라, 그리는 중간에 위쪽
  // 콘텐츠 높이가 바뀌면(예: "저장 중…" 표시, 미투표 안내 문구 등) 브라우저가
  // 스크롤 위치를 살짝 보정하면서 화면이 순간적으로 움찔거릴 수 있어요.
  // 다시 그리기 전후로 스크롤 위치를 그대로 복원해서 이 현상을 막습니다.
  var scrollX = window.scrollX, scrollY = window.scrollY;
  var canEdit = canEditNow();
  var isAdmin = isAdminNow();

  var banner = '';
  if(!CONFIG_OK){
    banner = '<div class="readonly-banner">이 페이지는 아직 Firebase 설정이 안 됐어요. index.html의 FIREBASE_CONFIG 값을 채워주세요.</div>';
  } else if(LOAD_ERROR){
    banner = '<div class="readonly-banner">서버에 연결하지 못했어요. 새로고침 해보세요. (계속 안 되면 Firestore 보안 규칙을 확인해주세요)</div>';
  } else if(!LOADED || !AUTH_READY){
    banner = '<div class="readonly-banner">불러오는 중…</div>';
  }

  var dateSummaryText = buildDateSummaryText();
  var placeSummaryText = buildPlaceSummaryText();

  // ---- 한 줄 게시판 ----
  var LOG_COLLAPSE_LIMIT = 3;
  var logsSorted = Array.isArray(STATE.logs) ? STATE.logs.slice().reverse() : [];
  var logsToShow = LOG_EXPANDED ? logsSorted : logsSorted.slice(0, LOG_COLLAPSE_LIMIT);
  var logsHtml = logsToShow.length
    ? '<ul class="log-list">' + logsToShow.map(function(l){
        return '<li class="log-row">' +
          '<span class="log-name">' + esc(l.name) + '</span>' +
          '<span class="log-text">' + esc(l.text) + '</span>' +
          '<span class="log-time">' + esc(formatUpdated(l.ts)) + '</span>' +
          (isAdmin ? '<button type="button" class="log-remove" data-action="remove-log" data-id="' + l.id + '" aria-label="글 삭제">×</button>' : '') +
        '</li>';
      }).join('') + '</ul>'
    : '<p class="log-empty">아직 남긴 글이 없어요.</p>';
  var logToggleHtml = logsSorted.length > LOG_COLLAPSE_LIMIT
    ? '<button type="button" class="log-toggle" data-action="toggle-log-expand">' +
        (LOG_EXPANDED ? '접기' : '더보기 (전체 ' + logsSorted.length + '개)') +
      '</button>'
    : '';

  var lastLogName = '';
  try { lastLogName = localStorage.getItem('clubLogName') || ''; } catch(e){}
  var logNameOptionsHtml = STATE.attendees.map(function(a){
    return '<option value="' + esc(a.name) + '"' + (a.name === lastLogName ? ' selected' : '') + '>' + esc(a.name) + '</option>';
  }).join('');
  var logFormHtml = canEdit
    ? '<form class="add-form log-form" id="log-form">' +
        '<select id="log-name" ' + (STATE.attendees.length ? '' : 'disabled') + '>' +
          '<option value="" disabled' + (STATE.attendees.some(function(a){return a.name === lastLogName;}) ? '' : ' selected') + '>이름 선택</option>' +
          logNameOptionsHtml +
        '</select>' +
        '<input type="text" id="log-text" placeholder="한 줄 남기기" maxlength="60" autocomplete="off">' +
        '<button type="submit">남기기</button>' +
      '</form>'
    : '';

  var dateNovoteCallout = buildDateNovoteCallout();

  var attendeeAddFormHtml = canEdit
    ? '<form class="add-form" id="add-form">' +
        '<input type="text" id="new-name" placeholder="이름 입력 후 추가" maxlength="20" autocomplete="off">' +
        '<button type="submit">추가</button>' +
      '</form>'
    : '';

  var updatedHtml = STATE.updatedAt
    ? '<p class="updated">마지막 수정 · ' + esc(formatUpdated(STATE.updatedAt)) + '</p>'
    : '';

  // ---- 날짜 투표 카드 ----
  if(DATE_EXPANDED && !STATE.dateOptions.some(function(o){return o.id===DATE_EXPANDED;})){
    DATE_EXPANDED = null;
  }
  var candidateISOs = STATE.dateOptions.map(function(o){ return o.date; });
  var dateOptionsHtml = buildDateOptionsHtml();

  var dateCalendarHtml = isAdmin ? buildCalendarGrid(CAL_VIEW.y, CAL_VIEW.m, candidateISOs) : '';

  var datePersonHtml = (STATE.attendees.length
    ? '<ul class="roster">' + STATE.attendees.map(function(a){
        return '<li class="roster-row"><span class="name">' + esc(a.name) + '</span>' +
          (STATE.dateOptions.length ? dateChips(a) : '') +
          (isAdmin ? '<button type="button" class="remove" data-action="remove" data-id="' + a.id + '" aria-label="' + esc(a.name) + ' 삭제">×</button>' : '') +
        '</li>';
      }).join('') + '</ul>'
    : '<p class="empty">아직 등록된 인원이 없어요. 아래에서 이름을 추가해 보세요.</p>') +
    (!STATE.dateOptions.length ? '<p class="pref-hint">후보 날짜를 추가하면 여기서 투표할 수 있어요.</p>' : '');

  // ---- 장소 투표 카드 ----
  var placeOptionsHtml = buildPlaceOptionsHtml();

  var addPlaceHtml = canEdit
    ? '<form class="add-form" id="add-place-form">' +
        '<input type="text" id="new-place" placeholder="장소 입력 후 추가" maxlength="40" autocomplete="off">' +
        '<button type="submit">추가</button>' +
      '</form>'
    : '';

  var placePersonHtml = STATE.placeOptions.length
    ? (STATE.attendees.length
        ? '<ul class="roster">' + STATE.attendees.map(function(a){
            return '<li class="roster-row"><span class="name">' + esc(a.name) + '</span>' + placeChips(a) + '</li>';
          }).join('') + '</ul>'
        : '<p class="empty">날짜 투표에서 이름을 먼저 추가해주세요.</p>')
    : '<p class="pref-hint">후보 장소를 추가하면 여기서 투표할 수 있어요.</p>';

  document.getElementById('app').innerHTML =
    banner +
    '<header class="card head">' +
      '<p class="eyebrow">사내 동호회 공지</p>' +
      titleBlock() +
      '<div class="meta">' +
        summaryRow(iconCal(), '날짜', dateSummaryText, 'date-summary-value') +
        summaryRow(iconPin(), '장소', placeSummaryText, 'place-summary-value') +
      '</div>' +
      '<div class="log-board">' +
        '<div class="log-board-head"><h3>한 줄 게시판</h3></div>' +
        logsHtml +
        logToggleHtml +
        logFormHtml +
      '</div>' +
      adminRow() +
    '</header>' +
    '<div class="poll-columns">' +
      '<section class="card">' +
        '<div class="section-head">' +
          '<h2>날짜 투표 <span class="quarter-tag">' + todayParts().y + '년 ' + quarterOf(todayParts().m) + '분기</span></h2>' +
          '<div class="section-actions">' +
            '<span class="stat stat-saving' + (SAVING ? '' : ' stat-saving-slot') + '">저장 중…</span>' +
            (isAdmin ? '<button type="button" class="reset-btn" data-action="reset-date">투표 초기화</button>' : '') +
          '</div>' +
        '</div>' +
        '<div id="date-novote-wrap">' + dateNovoteCallout + '</div>' +
        '<div id="date-poll-list-wrap">' + dateOptionsHtml + '</div>' +
        dateCalendarHtml +
        datePersonHtml +
        attendeeAddFormHtml +
      '</section>' +
      '<section class="card">' +
        '<div class="section-head">' +
          '<h2>장소 투표</h2>' +
          (isAdmin ? '<div class="section-actions"><button type="button" class="reset-btn" data-action="reset-place">투표 초기화</button></div>' : '') +
        '</div>' +
        '<div id="place-poll-list-wrap">' + placeOptionsHtml + '</div>' +
        addPlaceHtml +
        placePersonHtml +
      '</section>' +
    '</div>' +
    updatedHtml;

  if(EDITING === 'title'){
    var input = document.getElementById('edit-input');
    if(input){ input.focus(); input.select(); }
  } else {
    // 편집 중이 아닐 때만 스크롤 위치를 복원해요 (편집 시작 시엔 입력창으로
    // 포커스 이동하면서 자연스럽게 스크롤되는 게 맞으니 그대로 둡니다).
    var anchorSel = anchorSelector(SCROLL_ANCHOR);
    var anchorEl = anchorSel ? document.querySelector(anchorSel) : null;
    if(anchorEl){
      var delta = anchorEl.getBoundingClientRect().top - SCROLL_ANCHOR.top;
      if(delta) window.scrollBy(0, delta);
    } else {
      window.scrollTo(scrollX, scrollY);
    }
  }
}

function showToast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.hidden = false;
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
}

// Firebase 연동
// ---------------------------------------------------------------------
var db = null, auth = null, docRef = null;

function persist(mutate, opts){
  opts = opts || {};
  if(!canEditNow()) return;
  EDITING = null;
  // quiet 모드(투표 칩처럼 자주 누르는 조작)에서는 "저장 중…" 표시를 위해
  // 화면 전체를 다시 그리지 않아요 - 이미 버튼 자체는 즉시 눌린 것처럼
  // 보여줬고, 저장이 끝나면 onSnapshot이 투표 현황만 부분적으로 갱신해요.
  if(!opts.quiet){
    SAVING = true;
    render();
  }
  runTransaction(db, function(tx){
    return tx.get(docRef).then(function(snap){
      var data = snap.exists() ? snap.data() : JSON.parse(JSON.stringify(DEFAULT_STATE));
      data = migrateState(JSON.parse(JSON.stringify(data)));
      mutate(data);
      data.updatedAt = new Date().toISOString();
      tx.set(docRef, data);
    });
  }).then(function(){
    if(!opts.quiet){
      SAVING = false;
      // Don't rely on the onSnapshot listener to re-render: whether the
      // snapshot for this write arrives before or after this handler runs
      // is not guaranteed, so re-enable the UI here regardless. If the
      // snapshot lands after, it will simply render again with the
      // confirmed data.
      render();
    }
  }).catch(function(err){
    console.error(err);
    if(!opts.quiet){
      SAVING = false;
      render();
    }
    if(opts.onError) opts.onError();
    showToast('저장하지 못했어요. 다시 시도해 주세요.');
  });
}

function handleClick(e){
  captureScrollAnchor(e.target);
  var editBtn = e.target.closest('[data-action="edit-field"]');
  if(editBtn){
    EDITING = editBtn.getAttribute('data-field');
    render();
    return;
  }
  var cancelBtn = e.target.closest('[data-action="cancel-field"]');
  if(cancelBtn){
    EDITING = null;
    render();
    return;
  }
  var saveBtn = e.target.closest('[data-action="save-field"]');
  if(saveBtn){
    saveField(saveBtn.getAttribute('data-field'));
    return;
  }
  var prevBtn = e.target.closest('[data-action="cal-prev"]');
  if(prevBtn){
    if(!isAdminNow()) return;
    CAL_VIEW.m -= 1;
    if(CAL_VIEW.m < 0){ CAL_VIEW.m = 11; CAL_VIEW.y -= 1; }
    render();
    return;
  }
  var nextBtn = e.target.closest('[data-action="cal-next"]');
  if(nextBtn){
    if(!isAdminNow()) return;
    CAL_VIEW.m += 1;
    if(CAL_VIEW.m > 11){ CAL_VIEW.m = 0; CAL_VIEW.y += 1; }
    render();
    return;
  }
  var pickOptBtn = e.target.closest('[data-action="pick-date-option"]');
  if(pickOptBtn){
    if(!isAdminNow()) return;
    var iso = pickOptBtn.getAttribute('data-date');
    var existing = STATE.dateOptions.find(function(o){return o.date===iso;});
    if(existing){
      // 이미 등록된 날짜예요 - 새로 추가하는 대신 그 날짜의 출석 리스트를 열고 닫아요.
      DATE_EXPANDED = (DATE_EXPANDED === existing.id) ? null : existing.id;
      render();
      return;
    }
    persist(function(data){
      if(!data.dateOptions.some(function(o){return o.date===iso;})){
        data.dateOptions.push({id: uid(), date: iso});
      }
    });
    return;
  }
  var toggleDateList = e.target.closest('[data-action="toggle-date-list"]');
  if(toggleDateList){
    var tid = toggleDateList.getAttribute('data-id');
    DATE_EXPANDED = (DATE_EXPANDED === tid) ? null : tid;
    // 이것도 투표 현황(날짜별 참여자 펼쳐보기) 영역 안의 조작이라 그 부분만
    // 다시 그려요 - 저장이 필요 없는 화면 전용 상태라 더 간단해요.
    patchDateVoteUI();
    return;
  }
  var toggleDatePick = e.target.closest('[data-action="toggle-date-pick"]');
  if(toggleDatePick && !toggleDatePick.disabled){
    var tpid = toggleDatePick.getAttribute('data-id');
    var tpOptId = toggleDatePick.getAttribute('data-opt');
    // 1) 누른 칩 자체는 화면 전체를 다시 그리지 않고 바로 반영해요.
    var tpWasActive = toggleDatePick.classList.contains('active');
    toggleDatePick.classList.toggle('active', !tpWasActive);
    toggleDatePick.setAttribute('aria-pressed', (!tpWasActive) ? 'true' : 'false');
    // 2) 투표 현황(집계/미투표 안내/요약 문구)만 함께 갱신해요.
    toggleDatePickOn(STATE, tpid, tpOptId);
    patchDateVoteUI();
    // 3) 서버에 저장하고, 실패하면 방금 반영한 내용을 되돌려요.
    persist(function(data){ toggleDatePickOn(data, tpid, tpOptId); }, {
      quiet: true,
      onError: function(){
        toggleDatePickOn(STATE, tpid, tpOptId);
        patchDateVoteUI();
        var btn = document.querySelector('[data-action="toggle-date-pick"][data-id="' + tpid + '"][data-opt="' + tpOptId + '"]');
        if(btn){
          btn.classList.toggle('active', tpWasActive);
          btn.setAttribute('aria-pressed', tpWasActive ? 'true' : 'false');
        }
      }
    });
    return;
  }
  var togglePlacePick = e.target.closest('[data-action="toggle-place-pick"]');
  if(togglePlacePick && !togglePlacePick.disabled){
    var tppid = togglePlacePick.getAttribute('data-id');
    var tppOptId = togglePlacePick.getAttribute('data-opt');
    var tppWasActive = togglePlacePick.classList.contains('active');
    togglePlacePick.classList.toggle('active', !tppWasActive);
    togglePlacePick.setAttribute('aria-pressed', (!tppWasActive) ? 'true' : 'false');
    togglePlacePickOn(STATE, tppid, tppOptId);
    patchPlaceVoteUI();
    persist(function(data){ togglePlacePickOn(data, tppid, tppOptId); }, {
      quiet: true,
      onError: function(){
        togglePlacePickOn(STATE, tppid, tppOptId);
        patchPlaceVoteUI();
        var pbtn = document.querySelector('[data-action="toggle-place-pick"][data-id="' + tppid + '"][data-opt="' + tppOptId + '"]');
        if(pbtn){
          pbtn.classList.toggle('active', tppWasActive);
          pbtn.setAttribute('aria-pressed', tppWasActive ? 'true' : 'false');
        }
      }
    });
    return;
  }
  var removeBtn = e.target.closest('[data-action="remove"]');
  if(removeBtn){
    if(!isAdminNow()) return;
    var rid = removeBtn.getAttribute('data-id');
    if(!window.confirm('이 인원을 명단에서 삭제할까요?')) return;
    persist(function(data){
      data.attendees = data.attendees.filter(function(x){ return x.id !== rid; });
    });
    return;
  }
  var removeDateOpt = e.target.closest('[data-action="remove-date-option"]');
  if(removeDateOpt){
    if(!isAdminNow()) return;
    var doid = removeDateOpt.getAttribute('data-id');
    if(!window.confirm('이 날짜 후보를 삭제할까요? 이 후보에 투표한 사람은 미투표로 바뀌어요.')) return;
    persist(function(data){
      data.dateOptions = data.dateOptions.filter(function(o){ return o.id !== doid; });
      data.attendees.forEach(function(a){
        if(Array.isArray(a.datePicks)){
          var idx = a.datePicks.indexOf(doid);
          if(idx !== -1) a.datePicks.splice(idx, 1);
        }
      });
    });
    return;
  }
  var removePlaceOpt = e.target.closest('[data-action="remove-place-option"]');
  if(removePlaceOpt){
    if(!isAdminNow()) return;
    var poid = removePlaceOpt.getAttribute('data-id');
    if(!window.confirm('이 장소 후보를 삭제할까요? 이 후보에 투표한 사람은 미투표로 바뀌어요.')) return;
    persist(function(data){
      data.placeOptions = data.placeOptions.filter(function(o){ return o.id !== poid; });
      data.attendees.forEach(function(a){
        if(Array.isArray(a.placePicks)){
          var idx = a.placePicks.indexOf(poid);
          if(idx !== -1) a.placePicks.splice(idx, 1);
        }
      });
    });
    return;
  }
  var removeLogBtn = e.target.closest('[data-action="remove-log"]');
  if(removeLogBtn){
    if(!isAdminNow()) return;
    var lid = removeLogBtn.getAttribute('data-id');
    if(!window.confirm('이 글을 삭제할까요?')) return;
    persist(function(data){
      if(!Array.isArray(data.logs)) data.logs = [];
      data.logs = data.logs.filter(function(l){ return l.id !== lid; });
    });
    return;
  }
  var toggleLogExpand = e.target.closest('[data-action="toggle-log-expand"]');
  if(toggleLogExpand){
    LOG_EXPANDED = !LOG_EXPANDED;
    render();
    return;
  }
  var resetDateBtn = e.target.closest('[data-action="reset-date"]');
  if(resetDateBtn){
    if(!isAdminNow()) return;
    if(!window.confirm('모든 인원의 날짜 투표를 초기화할까요? (후보 목록은 유지돼요)')) return;
    persist(function(data){
      data.attendees.forEach(function(a){ a.datePicks = []; });
    });
    return;
  }
  var resetPlaceBtn = e.target.closest('[data-action="reset-place"]');
  if(resetPlaceBtn){
    if(!isAdminNow()) return;
    if(!window.confirm('모든 인원의 장소 투표를 초기화할까요? (후보 목록은 유지돼요)')) return;
    persist(function(data){
      data.attendees.forEach(function(a){ a.placePicks = []; });
    });
    return;
  }
  var adminUnlockBtn = e.target.closest('[data-action="admin-unlock"]');
  if(adminUnlockBtn){
    var pin = window.prompt('관리자 PIN을 입력하세요');
    if(pin === null) return;
    if(pin === ADMIN_PIN){
      IS_ADMIN = true;
      try{ localStorage.setItem('clubAdminUnlocked', '1'); }catch(e){}
      showToast('관리자 모드가 켜졌어요.');
      render();
    } else {
      showToast('PIN이 올바르지 않아요.');
    }
    return;
  }
  var adminLockBtn = e.target.closest('[data-action="admin-lock"]');
  if(adminLockBtn){
    IS_ADMIN = false;
    try{ localStorage.removeItem('clubAdminUnlocked'); }catch(e){}
    showToast('관리자 모드를 껐어요.');
    render();
    return;
  }
  var copyBtn = e.target.closest('[data-action="copy-novote"]');
  if(copyBtn){
    var names = STATE.attendees.filter(function(a){return !Array.isArray(a.datePicks) || !a.datePicks.length;}).map(function(a){return a.name;});
    var text = '아직 날짜 투표를 안 한 사람: ' + names.join(', ');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('복사했어요.');
      }).catch(function(){
        showToast('복사에 실패했어요.');
      });
    } else {
      showToast('이 브라우저는 복사를 지원하지 않아요.');
    }
    return;
  }
}

function handleChange(e){
  // 날짜/장소 선호는 이제 <select> 대신 클릭 토글(chip) 방식이라 handleClick에서 처리해요.
  // change 이벤트를 쓰는 다른 입력이 생기면 여기에 추가하면 돼요.
}

function saveField(field){
  var input = document.getElementById('edit-input');
  if(!input) return;
  var value = input.value.trim();
  if(!value){ EDITING = null; render(); return; }
  persist(function(data){
    data[field] = value;
  });
}

function handleKeydown(e){
  if(e.target && e.target.id === 'edit-input'){
    if(e.key === 'Enter'){ e.preventDefault(); saveField(e.target.getAttribute('data-field')); }
    if(e.key === 'Escape'){ e.preventDefault(); EDITING = null; render(); }
  }
}

function handleSubmit(e){
  if(e.target && e.target.id === 'log-form'){
    e.preventDefault();
    var lnameInput = document.getElementById('log-name');
    var ltextInput = document.getElementById('log-text');
    var lname = lnameInput.value.trim();
    var ltext = ltextInput.value.trim();
    if(!lname || !ltext) return;
    try { localStorage.setItem('clubLogName', lname); } catch(e2){}
    persist(function(data){
      if(!Array.isArray(data.logs)) data.logs = [];
      data.logs.push({id: uid(), name: lname, text: ltext, ts: new Date().toISOString()});
      // 문서 하나에 모든 데이터가 들어있어서 너무 커지지 않도록 최근 50개만 유지해요.
      if(data.logs.length > 50) data.logs = data.logs.slice(data.logs.length - 50);
    });
    var againText = document.getElementById('log-text');
    if(againText){ againText.value = ''; againText.focus(); }
    return;
  }
  if(e.target && e.target.id === 'add-form'){
    e.preventDefault();
    var input = document.getElementById('new-name');
    var name = input.value.trim();
    if(!name) return;
    persist(function(data){
      data.attendees.push({id: uid(), name: name, datePicks: [], placePicks: []});
    });
    var again = document.getElementById('new-name');
    if(again){ again.value = ''; again.focus(); }
    return;
  }
  if(e.target && e.target.id === 'add-place-form'){
    e.preventDefault();
    var pinput = document.getElementById('new-place');
    var place = pinput.value.trim();
    if(!place) return;
    if(STATE.placeOptions.some(function(o){return o.place===place;})){
      showToast('이미 등록된 장소예요.');
      return;
    }
    persist(function(data){
      if(!data.placeOptions.some(function(o){return o.place===place;})){
        data.placeOptions.push({id: uid(), place: place});
      }
    });
    var pagain = document.getElementById('new-place');
    if(pagain){ pagain.value = ''; pagain.focus(); }
  }
}

function init(){
  var app = document.getElementById('app');
  app.addEventListener('click', handleClick);
  app.addEventListener('change', handleChange);
  app.addEventListener('keydown', handleKeydown);
  app.addEventListener('submit', handleSubmit);
  render();

  if(!CONFIG_OK) return;

  try{
    var fbApp = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(fbApp);
    auth = getAuth(fbApp);
    docRef = doc(db, 'clubEvents', EVENT_ID);
  }catch(e){
    console.error(e);
    LOAD_ERROR = true;
    render();
    return;
  }

  onAuthStateChanged(auth, function(user){
    AUTH_READY = !!user;
    render();
  });
  signInAnonymously(auth).catch(function(err){
    console.error(err);
    LOAD_ERROR = true;
    render();
  });

  onSnapshot(docRef, function(snap){
    var newState, isNewDoc = false;
    if(snap.exists()){
      newState = migrateState(snap.data());
    } else {
      newState = JSON.parse(JSON.stringify(DEFAULT_STATE));
      isNewDoc = true;
    }
    var newSig = structureSignature(newState);
    // 이전에 이미 한 번 불러온 상태에서, 인원/후보/게시판/제목 구성은 그대로고
    // 투표 결과만 바뀐 경우엔 화면 전체를 다시 그리지 않아요 - 다른 사람이
    // 투표해서 이 업데이트가 온 경우에도 마찬가지로 적용돼요.
    var sameStructure = LOADED && STATE_STRUCTURE_SIG !== null && STATE_STRUCTURE_SIG === newSig;
    STATE = newState;
    STATE_STRUCTURE_SIG = newSig;
    LOADED = true;
    if(isNewDoc){
      setDoc(docRef, STATE).catch(function(err){ console.error(err); });
    }
    if(sameStructure){
      patchDateVoteUI();
      patchPlaceVoteUI();
    } else {
      render();
    }
  }, function(err){
    console.error(err);
    LOAD_ERROR = true;
    render();
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
